<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓오브라우니의 나노 침투 시뮬레이터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        :root {
            --bg-outer: #cbd5e1;
            --bg-card: #f8fafc;
            --bg-chamber: #ffffff;
            --border-color: #94a3b8;
            --text-main: #1e293b;
            --text-desc: #64748b;
            --accent-green: #22c55e;
            --accent-green-border: #15803d;
            --primary-blue: #3b82f6;
        }

        body.dark-mode {
            --bg-outer: #090d16;
            --bg-card: #111827;
            --bg-chamber: #030712;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-desc: #9ca3af;
            --accent-green: #4ade80;
            --accent-green-border: #22c55e;
            --primary-blue: #60a5fa;
        }

        .font-flat {
            font-family: 'Fredoka', 'Noto Sans KR', sans-serif;
        }

        body, div, p, span, h1, h2, h3, h4, button {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }

        .key-active {
            background-color: #22c55e !important;
            color: white !important;
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        /* 꽉 찬 화면 캔버스를 위한 부드러운 하단 고정 스코어바 */
        .hud-panel {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="dark-mode font-flat min-h-screen flex flex-col bg-[var(--bg-outer)] text-[var(--text-main)] overflow-hidden transition-all duration-500">

    <!-- 상단 간소화된 반응형 헤더 -->
    <header class="w-full max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3 z-10">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-emerald-500/10 rounded-xl flex items-center justify-center border border-emerald-500/20">
                <i class="fa-solid fa-compass text-lg text-emerald-400 animate-spin-slow"></i>
            </div>
            <div>
                <h1 class="text-base md:text-lg font-bold tracking-tight flex items-center gap-2">
                    <span class="text-emerald-500">무한 파지 대증식 시뮬레이터</span>
                    <span class="text-[10px] font-normal opacity-75">(Swarm Evolution)</span>
                </h1>
                <p class="text-[10px] text-[var(--text-desc)]">
                    마켓오브라우니의 거대 백혈구 회피 실험실 <span class="text-emerald-500 font-semibold">(Infinite Cosmos v3)</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- 임시 세균 스폰 및 전체 리셋 버튼 (모달/헤더 공간에 안정적인 배치 보장) -->
            <button id="btn-spawn-bacteria" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-biohazard mr-1"></i> 세균 추가
            </button>
            <button id="btn-reset" class="bg-rose-500 hover:bg-rose-600 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg transition">
                <i class="fa-solid fa-arrow-rotate-left mr-1"></i> 전체 리셋
            </button>
            <button id="theme-toggle" class="bg-[var(--bg-card)] text-[var(--text-main)] px-3 py-1.5 rounded-lg text-[11px] font-semibold hover:opacity-90 transition flex items-center gap-1.5 border border-[var(--border-color)]">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
                <span id="theme-text">라이트 모드</span>
            </button>
            <span class="hidden md:inline-block bg-indigo-600 text-white text-[10px] px-2.5 py-1.5 rounded-full font-bold shadow-sm">
                <i class="fa-solid fa-microscope mr-1"></i> 1마리로 시작해 무한증식!
            </span>
        </div>
    </header>

    <!-- 메인 시뮬레이터 화면 영역 -->
    <main class="flex-grow w-full h-full relative flex flex-col items-stretch">
        
        <!-- 실시간 꽉 찬 대형 캔버스 뷰포트 -->
        <div class="absolute inset-0 z-0">
            <canvas id="stageCanvas" class="w-full h-full block bg-[var(--bg-chamber)]"></canvas>
        </div>

        <!-- 왼쪽 UI 오버레이: 방향키 및 컨트롤러 -->
        <div class="absolute bottom-6 left-6 z-10 hidden md:flex flex-col gap-3 max-w-[220px]">
            <div class="bg-[var(--bg-card)]/90 hud-panel p-4 rounded-2xl border border-[var(--border-color)] shadow-xl flex flex-col items-center">
                <h4 class="text-[11px] font-bold mb-3 flex items-center gap-1">
                    <i class="fa-solid fa-wind text-emerald-400"></i>
                    <span>바람 제어 가이드</span>
                </h4>
                
                <div class="flex flex-col items-center gap-1.5 scale-90">
                    <button id="key-W" class="w-10 h-10 bg-[var(--bg-outer)] text-[var(--text-main)] font-extrabold rounded-lg border border-[var(--border-color)] flex items-center justify-center text-xs shadow-sm">W</button>
                    <div class="flex gap-1.5">
                        <button id="key-A" class="w-10 h-10 bg-[var(--bg-outer)] text-[var(--text-main)] font-extrabold rounded-lg border border-[var(--border-color)] flex items-center justify-center text-xs shadow-sm">A</button>
                        <button id="key-S" class="w-10 h-10 bg-[var(--bg-outer)] text-[var(--text-main)] font-extrabold rounded-lg border border-[var(--border-color)] flex items-center justify-center text-xs shadow-sm">S</button>
                        <button id="key-D" class="w-10 h-10 bg-[var(--bg-outer)] text-[var(--text-main)] font-extrabold rounded-lg border border-[var(--border-color)] flex items-center justify-center text-xs shadow-sm">D</button>
                    </div>
                </div>
                
                <div class="w-full mt-4 space-y-1">
                    <div class="flex justify-between items-center text-[10px]">
                        <span>바람 감쇠력</span>
                        <span id="wind-power-display" class="font-bold text-emerald-500">2.2x</span>
                    </div>
                    <input type="range" id="input-wind-power" min="0.5" max="5.0" step="0.1" value="2.2" class="w-full accent-emerald-500 cursor-pointer h-1.5 bg-[var(--bg-outer)] rounded-lg appearance-none">
                </div>
            </div>
        </div>

        <!-- 오른쪽 UI 오버레이: 업그레이드 숍 -->
        <div class="absolute top-6 right-6 z-10 w-72 max-h-[80vh] overflow-y-auto hidden lg:flex flex-col gap-3">
            <div class="bg-[var(--bg-card)]/90 hud-panel p-4 rounded-2xl border border-[var(--border-color)] shadow-xl flex flex-col justify-between">
                <div>
                    <h3 class="text-xs font-extrabold mb-1 text-center flex items-center justify-center gap-1">
                        <i class="fa-solid fa-dna text-indigo-500"></i>
                        <span>유전자 진화 업그레이드</span>
                    </h3>
                    <p class="text-[10px] text-[var(--text-desc)] text-center mb-4">대장균 폭파 점수로 파지의 능력을 강화하세요.</p>
                    
                    <div class="space-y-3">
                        <!-- 업그레이드 1: 주사 속도 -->
                        <button onclick="purchaseUpgrade('injection')" id="upg-injection" class="w-full flex items-center justify-between text-left p-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-outer)]/20 hover:border-emerald-500/50 hover:bg-emerald-500/5 transition">
                            <div class="flex items-center gap-2">
                                <span class="p-1.5 bg-emerald-500/10 text-emerald-500 rounded-lg text-xs"><i class="fa-solid fa-syringe"></i></span>
                                <div>
                                    <h4 class="font-bold text-[11px]">주사 속도</h4>
                                    <p class="text-[9px] text-[var(--text-desc)]">DNA 주입 가속화</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-[9px] font-bold text-emerald-500 block" id="upg-injection-level">Lv.1</span>
                                <span class="text-[9px] text-[var(--text-desc)]"><b class="font-bold text-emerald-500 text-xs" id="upg-injection-cost">100</b> DNA</span>
                            </div>
                        </button>

                        <!-- 업그레이드 2: 폭발 크기 (Burst Size) -->
                        <button onclick="purchaseUpgrade('burst')" id="upg-burst" class="w-full flex items-center justify-between text-left p-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-outer)]/20 hover:border-emerald-500/50 hover:bg-emerald-500/5 transition">
                            <div class="flex items-center gap-2">
                                <span class="p-1.5 bg-blue-500/10 text-blue-500 rounded-lg text-xs"><i class="fa-solid fa-burst"></i></span>
                                <div>
                                    <h4 class="font-bold text-[11px]">폭발 크기</h4>
                                    <p class="text-[9px] text-[var(--text-desc)]">자손 방출 대폭 상승</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-[9px] font-bold text-blue-500 block" id="upg-burst-level">Lv.1</span>
                                <span class="text-[9px] text-[var(--text-desc)]"><b class="font-bold text-emerald-500 text-xs" id="upg-burst-cost">150</b> DNA</span>
                            </div>
                        </button>

                        <!-- 업그레이드 3: 감지 범위 (Magnetic Range) -->
                        <button onclick="purchaseUpgrade('magnetic')" id="upg-magnetic" class="w-full flex items-center justify-between text-left p-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-outer)]/20 hover:border-emerald-500/50 hover:bg-emerald-500/5 transition">
                            <div class="flex items-center gap-2">
                                <span class="p-1.5 bg-purple-500/10 text-purple-500 rounded-lg text-xs"><i class="fa-solid fa-magnet"></i></span>
                                <div>
                                    <h4 class="font-bold text-[11px]">감지 범위</h4>
                                    <p class="text-[9px] text-[var(--text-desc)]">세균 자력 흡착 반경</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-[9px] font-bold text-purple-500 block" id="upg-magnetic-level">Lv.1</span>
                                <span class="text-[9px] text-[var(--text-desc)]"><b class="font-bold text-emerald-500 text-xs" id="upg-magnetic-cost">200</b> DNA</span>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- 천적 알림 경고판 -->
                <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-3 text-[10px] mt-4 flex items-start gap-2">
                    <span class="text-red-500 text-sm animate-bounce"><i class="fa-solid fa-triangle-exclamation"></i></span>
                    <div>
                        <h5 class="font-bold text-red-400">천적 경보: 백혈구 출현</h5>
                        <p class="text-[9px] text-[var(--text-desc)] leading-relaxed mt-0.5">
                            하얗고 둥글며 촉수가 달린 거대 백혈구는 파지들을 빨아들여 파괴합니다! 거리를 유지하며 바람으로 도망치세요!
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 오버레이: 미생물 실시간 모니터링 데시보드 HUD -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-full max-w-xl px-4">
            <div class="bg-[var(--bg-card)]/90 hud-panel border border-[var(--border-color)] px-5 py-3 rounded-2xl shadow-2xl flex justify-between items-center text-center text-xs">
                <div>
                    <p class="text-[9px] text-[var(--text-desc)] font-bold uppercase tracking-wider">DNA 에너지</p>
                    <p class="text-lg font-black text-emerald-500" id="dna-score-display">0</p>
                </div>
                <div class="h-6 w-px bg-[var(--border-color)]"></div>
                <div>
                    <p class="text-[9px] text-[var(--text-desc)] font-bold uppercase tracking-wider">살아있는 파지 수</p>
                    <p class="text-lg font-black text-emerald-400" id="phage-count-display">1</p>
                </div>
                <div class="h-6 w-px bg-[var(--border-color)]"></div>
                <div>
                    <p class="text-[9px] text-[var(--text-desc)] font-bold uppercase tracking-wider">감염 진행도</p>
                    <p class="text-lg font-black text-indigo-500" id="infected-count-display">0 / 0</p>
                </div>
                <div class="h-6 w-px bg-[var(--border-color)]"></div>
                <div>
                    <button id="btn-emergency-spawn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-extrabold px-2.5 py-1.5 rounded-lg transition">
                        <i class="fa-solid fa-plus mr-1"></i> 파지 구원
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- 브라우저 경고창 대체용 대화상자 모달 -->
    <div id="game-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-[var(--bg-card)] rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-[var(--border-color)] text-center animate-pulse-soft">
            <div id="modal-icon-container" class="text-emerald-500 text-4xl mb-3">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="modal-title" class="font-black text-lg mb-1">알림</h3>
            <p id="modal-desc" class="text-xs text-[var(--text-desc)] mb-6 leading-relaxed">알림 메시지 내용</p>
            <button id="modal-btn-confirm" class="bg-emerald-500 text-white font-bold px-6 py-2 rounded-xl text-xs transition w-full hover:opacity-90">
                확인
            </button>
        </div>
    </div>

    <script>
        // --- 1. 무한 맵 및 카메라 상수 선언 ---
        const WORLD_SIZE = 3000; // 가상 지리지도 월드 경계 크기 (3000px × 3000px)
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');
        
        let themeMode = 'dark'; // 기본 다크 모드
        let dnaPoints = 0;      // 파지 멸균을 촉진하는 주 점수

        // 카메라 뷰 컨트롤 (지렁이 게임 방식)
        let camera = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            targetX: WORLD_SIZE / 2,
            targetY: WORLD_SIZE / 2
        };

        // 실시간 바람 제어 물리 변수
        let windAngle = 0;       
        let windPower = 2.2;     
        let windX = 0;
        let windY = 0;

        // 키보드 방향타 입력 상태 수집
        let activeKeys = {
            w: false, a: false, s: false, d: false
        };

        // 업그레이드 수치 관리
        let upgrades = {
            injection: { level: 1, baseCost: 100, costMultiplier: 1.5, value: 0.018 }, 
            burst: { level: 1, baseCost: 150, costMultiplier: 1.6, value: 8 },        
            magnetic: { level: 1, baseCost: 200, costMultiplier: 1.7, value: 60 }     
        };

        // 생물체 리스트
        let bacteriaList = [];
        let phageSwarm = [];
        let enemies = [];          // 천적 백혈구(Macrophage) 리스트
        let particles = [];
        let windVisualLines = []; 

        // --- 2. 다크/라이트 모드 테마 제어 시스템 ---
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                if (themeMode === 'dark') {
                    document.body.classList.remove('dark-mode');
                    themeIcon.className = 'fa-solid fa-sun text-amber-500';
                    themeText.innerText = '다크 모드';
                    themeMode = 'light';
                } else {
                    document.body.classList.add('dark-mode');
                    themeIcon.className = 'fa-solid fa-moon';
                    themeText.innerText = '라이트 모드';
                    themeMode = 'dark';
                }
            });
        }

        // 커스텀 모달 출력기
        const gameModal = document.getElementById('game-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalIconContainer = document.getElementById('modal-icon-container');
        const modalBtnConfirm = document.getElementById('modal-btn-confirm');

        function triggerModal(title, text, type = 'success') {
            if (!gameModal) return;
            modalTitle.innerText = title;
            modalDesc.innerText = text;
            if (type === 'success') {
                modalIconContainer.innerHTML = '<i class="fa-solid fa-dna text-emerald-500"></i>';
            } else if (type === 'error') {
                modalIconContainer.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-500"></i>';
            } else {
                modalIconContainer.innerHTML = '<i class="fa-solid fa-wind text-sky-500"></i>';
            }
            gameModal.classList.remove('hidden');
        }

        if (modalBtnConfirm) {
            modalBtnConfirm.addEventListener('click', () => {
                gameModal.classList.add('hidden');
            });
        }

        // --- 3. 실시간 유연한 바람 조작 로직 (WASD + 마우스 연계) ---
        const powerInput = document.getElementById('input-wind-power');
        const powerDisplay = document.getElementById('wind-power-display');
        if (powerInput) {
            powerInput.addEventListener('input', (e) => {
                windPower = parseFloat(e.target.value);
                if (powerDisplay) powerDisplay.innerText = windPower.toFixed(1) + 'x';
            });
        }

        // 키보드 WASD 바인딩
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            let keyId = "";
            if (key === 'w' || e.key === 'ArrowUp') { activeKeys.w = true; keyId = 'key-W'; }
            if (key === 'a' || e.key === 'ArrowLeft') { activeKeys.a = true; keyId = 'key-A'; }
            if (key === 's' || e.key === 'ArrowDown') { activeKeys.s = true; keyId = 'key-S'; }
            if (key === 'd' || e.key === 'ArrowRight') { activeKeys.d = true; keyId = 'key-D'; }

            if (keyId) {
                const btn = document.getElementById(keyId);
                if (btn) btn.classList.add('key-active');
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            let keyId = "";
            if (key === 'w' || e.key === 'ArrowUp') { activeKeys.w = false; keyId = 'key-W'; }
            if (key === 'a' || e.key === 'ArrowLeft') { activeKeys.a = false; keyId = 'key-A'; }
            if (key === 's' || e.key === 'ArrowDown') { activeKeys.s = false; keyId = 'key-S'; }
            if (key === 'd' || e.key === 'ArrowRight') { activeKeys.d = false; keyId = 'key-D'; }

            if (keyId) {
                const btn = document.getElementById(keyId);
                if (btn) btn.classList.remove('key-active');
            }
        });

        // 마우스 커서 위치 수집
        let mouseX = null;
        let mouseY = null;
        let isMouseInCanvas = false;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            isMouseInCanvas = true;
        });

        canvas.addEventListener('mouseleave', () => {
            isMouseInCanvas = false;
        });

        // 풍속 및 풍향 종합 계산
        function calculateRealTimeWind() {
            let targetWindX = 0;
            let targetWindY = 0;
            let activelyControlled = false;

            if (activeKeys.w) { targetWindY = -windPower; activelyControlled = true; }
            if (activeKeys.s) { targetWindY = windPower; activelyControlled = true; }
            if (activeKeys.a) { targetWindX = -windPower; activelyControlled = true; }
            if (activeKeys.d) { targetWindX = windPower; activelyControlled = true; }

            // 마우스 기반 흐름 결합
            if (!activelyControlled && isMouseInCanvas && mouseX !== null && mouseY !== null) {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const dx = mouseX - cx;
                const dy = mouseY - cy;
                const distance = Math.hypot(dx, dy);

                if (distance > 20) {
                    targetWindX = (dx / distance) * windPower;
                    targetWindY = (dy / distance) * windPower;
                    activelyControlled = true;
                }
            }

            // 부유 미풍 디폴트
            if (!activelyControlled) {
                const t = Date.now() * 0.0003;
                targetWindX = Math.cos(t) * 0.4;
                targetWindY = Math.sin(t) * 0.4;
            }

            windX += (targetWindX - windX) * 0.12;
            windY += (targetWindY - windY) * 0.12;
            windAngle = Math.atan2(windY, windX);
        }

        // --- 4. 무한 맵 경계 안전 제어 시스템 ---
        function keepInWorld(obj, r = 10) {
            if (obj.x < r) { obj.x = r; obj.vx *= -0.5; }
            if (obj.x > WORLD_SIZE - r) { obj.x = WORLD_SIZE - r; obj.vx *= -0.5; }
            if (obj.y < r) { obj.y = r; obj.vy *= -0.5; }
            if (obj.y > WORLD_SIZE - r) { obj.y = WORLD_SIZE - r; obj.vy *= -0.5; }
        }

        // --- 5. 귀여운 세균 (CuteBacteria) 클래스 ---
        const pastelColors = [
            { main: '#fca5a5', border: '#f87171', shadow: '#ef4444' }, 
            { main: '#fed7aa', border: '#fb923c', shadow: '#f97316' }, 
            { main: '#c084fc', border: '#a855f7', shadow: '#8b5cf6' }, 
            { main: '#93c5fd', border: '#60a5fa', shadow: '#3b82f6' }  
        ];

        class CuteBacteria {
            constructor(spawnNearCenter = false) {
                if (spawnNearCenter) {
                    // 첫 로딩 시에는 유저 시야 안에서 스폰
                    this.x = WORLD_SIZE / 2 + (Math.random() - 0.5) * 500;
                    this.y = WORLD_SIZE / 2 + (Math.random() - 0.5) * 500;
                } else {
                    // 무한 맵 무작위 스폰
                    this.x = Math.random() * (WORLD_SIZE - 200) + 100;
                    this.y = Math.random() * (WORLD_SIZE - 200) + 100;
                }
                this.width = 44;
                this.height = 22;
                this.angle = Math.random() * Math.PI * 2;
                this.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];

                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;

                this.isInfected = false;
                this.infectionProgress = 0; 
                this.isDead = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += 0.003;

                keepInWorld(this, this.width / 2);

                if (this.isInfected && this.infectionProgress < 1) {
                    this.infectionProgress += upgrades.injection.value;
                    
                    if (Math.random() < 0.4) {
                        particles.push(new DnaDot(this.x, this.y, this.color.shadow));
                    }
                }

                if (this.infectionProgress >= 1) {
                    this.burstAndLysis();
                }
            }

            burstAndLysis() {
                this.isDead = true;
                addDnaPoints(45);

                // 파티클 폭발 이펙트
                for (let i = 0; i < 20; i++) {
                    particles.push(new FlatParticle(this.x, this.y, this.color.border));
                }

                // 기하급수적 자손 증식 기제
                const offspringCount = upgrades.burst.value;
                for (let i = 0; i < offspringCount; i++) {
                    const angle = (i * Math.PI * 2) / offspringCount + (Math.random() - 0.5) * 0.3;
                    phageSwarm.push(new MiniaturePhage(this.x, this.y, angle));
                }
            }

            draw() {
                // 월드 좌표를 카메라 스크린 좌표로 변환
                let sx = this.x - camera.x + canvas.width / 2;
                let sy = this.y - camera.y + canvas.height / 2;

                // 스크린 이탈 연산 (그리기 생략으로 프레임 보장)
                if (sx < -100 || sx > canvas.width + 100 || sy < -100 || sy > canvas.height + 100) return;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(this.angle);

                // 플랫 섀도우
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.beginPath();
                ctx.arc(-2, 2, this.height / 2, Math.PI / 2, (Math.PI * 3) / 2);
                ctx.lineTo(this.width / 2, -this.height / 2 + 2);
                ctx.arc(this.width / 2, 2, this.height / 2, (Math.PI * 3) / 2, Math.PI / 2);
                ctx.closePath();
                ctx.fill();

                let bodyColor = this.color.main;
                let strokeColor = this.color.border;

                if (this.isInfected) {
                    bodyColor = blendColors(this.color.main, '#4ade80', this.infectionProgress);
                    strokeColor = blendColors(this.color.border, '#22c55e', this.infectionProgress);
                }

                ctx.fillStyle = bodyColor;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 4;
                
                ctx.beginPath();
                const radius = this.height / 2;
                ctx.arc(-this.width / 4, 0, radius, Math.PI / 2, (Math.PI * 3) / 2);
                ctx.lineTo(this.width / 4, -radius);
                ctx.arc(this.width / 4, 0, radius, (Math.PI * 3) / 2, Math.PI / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 표정 얼굴
                ctx.fillStyle = '#1e293b';
                if (this.isInfected) {
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-10, -3); ctx.lineTo(-6, 1);
                    ctx.moveTo(-6, -3); ctx.lineTo(-10, 1);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(6, -3); ctx.lineTo(10, 1);
                    ctx.moveTo(10, -3); ctx.lineTo(6, 1);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 3, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(-8, -1, 2.5, 0, Math.PI * 2);
                    ctx.arc(8, -1, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(0, 1.5, 3.5, 0, Math.PI);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        function blendColors(c1, c2, ratio) {
            const getRGB = hex => {
                let h = hex.replace('#', '');
                if (h.length === 3) h = h.split('').map(x => x+x).join('');
                return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
            };
            const rgb1 = getRGB(c1);
            const rgb2 = getRGB(c2);
            const r = Math.max(0, Math.min(1, ratio));
            const rgb = rgb1.map((v, i) => Math.round(v + (rgb2[i] - v) * r));
            return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
        }

        // --- 6. 극소형 박테리오파지 (Miniature Phage) 클래스 ---
        class MiniaturePhage {
            constructor(x, y, angle = Math.random() * Math.PI * 2) {
                this.x = x;
                this.y = y;
                this.size = 2.8; 
                
                this.vx = Math.cos(angle) * (Math.random() * 2 + 1);
                this.vy = Math.sin(angle) * (Math.random() * 2 + 1);

                this.isDocked = false;
                this.targetHost = null;
                this.dockOffsetAngle = 0;
            }

            update() {
                if (this.isBoundToHost()) {
                    this.x = this.targetHost.x + Math.cos(this.dockOffsetAngle) * (this.targetHost.width * 0.42);
                    this.y = this.targetHost.y + Math.sin(this.dockOffsetAngle) * (this.targetHost.height * 0.42);
                    return;
                }

                // 조작 가속 가중
                this.vx += (windX - this.vx) * 0.08;
                this.vy += (windY - this.vy) * 0.08;

                this.vx += (Math.random() - 0.5) * 0.25;
                this.vy += (Math.random() - 0.5) * 0.25;

                this.x += this.vx;
                this.y += this.vy;

                keepInWorld(this, this.size);

                // 숙주 검색
                let nearest = null;
                let minDist = upgrades.magnetic.value;

                bacteriaList.forEach(bac => {
                    if (!bac.isInfected && !bac.isDead) {
                        let d = Math.hypot(bac.x - this.x, bac.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            nearest = bac;
                        }
                    }
                });

                if (nearest) {
                    let dx = nearest.x - this.x;
                    let dy = nearest.y - this.y;
                    this.x += (dx / minDist) * 2.5;
                    this.y += (dy / minDist) * 2.5;

                    if (minDist < 16) {
                        this.targetHost = nearest;
                        this.isDocked = true;
                        nearest.isInfected = true;
                        this.dockOffsetAngle = Math.atan2(this.y - nearest.y, this.x - nearest.x);
                    }
                }
            }

            isBoundToHost() {
                return this.isDocked && this.targetHost && !this.targetHost.isDead;
            }

            draw() {
                let sx = this.x - camera.x + canvas.width / 2;
                let sy = this.y - camera.y + canvas.height / 2;

                if (sx < -50 || sx > canvas.width + 50 || sy < -50 || sy > canvas.height + 50) return;

                ctx.save();
                ctx.translate(sx, sy);

                let angle = Math.atan2(this.vy, this.vx) + Math.PI / 2;
                if (this.isBoundToHost()) {
                    angle = this.dockOffsetAngle + Math.PI / 2;
                }
                ctx.rotate(angle);

                ctx.fillStyle = themeMode === 'dark' ? '#4ade80' : '#22c55e';
                ctx.strokeStyle = themeMode === 'dark' ? '#22c55e' : '#15803d';
                ctx.lineWidth = 1.0;

                // 머리 육각형
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let a = (i * Math.PI) / 3;
                    let px = Math.cos(a) * this.size;
                    let py = Math.sin(a) * this.size - this.size;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 꼬리 주입 튜브
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, this.size * 1.5);
                ctx.stroke();

                // 다리
                ctx.beginPath();
                ctx.moveTo(0, this.size * 1.5); ctx.lineTo(-this.size * 0.9, this.size * 2.2);
                ctx.moveTo(0, this.size * 1.5); ctx.lineTo(this.size * 0.9, this.size * 2.2);
                ctx.moveTo(0, this.size * 1.5); ctx.lineTo(0, this.size * 2.5);
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- 7. 새로운 시스템: 천적 백혈구 (Macrophage) 클래스 ---
        class Macrophage {
            constructor() {
                // 시야 바깥 무작위 장소에 스폰
                this.x = Math.random() * WORLD_SIZE;
                this.y = Math.random() * WORLD_SIZE;
                this.r = 48; // 거대한 청소기 포스
                
                // 가벼운 순찰 이동 속도 설정
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                
                this.eatingAnimation = 0;
                this.pulseOffset = Math.random() * 100;
            }

            update() {
                // 가장 가까운 파지 탐색하여 공격 대상 설정
                let nearestPhage = null;
                let minDist = 320; // 백혈구 감지 거리

                phageSwarm.forEach(p => {
                    let d = Math.hypot(p.x - this.x, p.y - this.y);
                    if (d < minDist) {
                        minDist = d;
                        nearestPhage = p;
                    }
                });

                if (nearestPhage) {
                    // 표적이 된 파지를 사나운 가속도로 추격
                    let angle = Math.atan2(nearestPhage.y - this.y, nearestPhage.x - this.x);
                    this.vx += Math.cos(angle) * 0.18;
                    this.vy += Math.sin(angle) * 0.18;
                } else {
                    // 주변 파지가 없을 때 자율 순항 정화 비행
                    this.vx += (Math.random() - 0.5) * 0.1;
                    this.vy += (Math.random() - 0.5) * 0.1;
                }

                // 속도 상한
                let speed = Math.hypot(this.vx, this.vy);
                let maxSpeed = nearestPhage ? 2.5 : 1.2;
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                keepInWorld(this, this.r);

                // 파지 무리 사냥 충돌 충격 검사
                for (let i = phageSwarm.length - 1; i >= 0; i--) {
                    let p = phageSwarm[i];
                    let distToPhage = Math.hypot(p.x - this.x, p.y - this.y);
                    if (distToPhage < this.r + p.size) {
                        // 빨아들여 파괴 완료
                        phageSwarm.splice(i, 1);
                        this.eatingAnimation = 15; // 쩝쩝거리는 모션 프레임 연장
                        
                        // 파지 제거 붉은 파편 형성
                        for (let j = 0; j < 5; j++) {
                            particles.push(new FlatParticle(p.x, p.y, '#ef4444'));
                        }
                    }
                }

                if (this.eatingAnimation > 0) this.eatingAnimation--;
            }

            draw() {
                let sx = this.x - camera.x + canvas.width / 2;
                let sy = this.y - camera.y + canvas.height / 2;

                if (sx < -120 || sx > canvas.width + 120 || sy < -120 || sy > canvas.height + 120) return;

                ctx.save();
                ctx.translate(sx, sy);

                // 몸체 아메바풍 굴곡 진동 렌더링
                let pulse = 1 + Math.sin(Date.now() * 0.005 + this.pulseOffset) * 0.04;
                if (this.eatingAnimation > 0) pulse *= 1.15; // 포식 시 일시 팽창 효과

                ctx.fillStyle = themeMode === 'dark' ? '#f1f5f9' : '#e2e8f0';
                ctx.strokeStyle = themeMode === 'dark' ? '#cbd5e1' : '#94a3b8';
                ctx.lineWidth = 4.5;

                ctx.beginPath();
                ctx.arc(0, 0, this.r * pulse, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 사나운 안구 조직 드로잉
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(-14, -8, 4.5, 0, Math.PI * 2);
                ctx.arc(14, -8, 4.5, 0, Math.PI * 2);
                ctx.fill();

                // 앵그리 브로우 눈썹
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-20, -15); ctx.lineTo(-8, -11);
                ctx.moveTo(20, -15); ctx.lineTo(8, -11);
                ctx.stroke();

                // 진공 흡입 입구 드로잉
                ctx.fillStyle = '#1e293b';
                if (this.eatingAnimation > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 12, 14, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 10, 8, 0, Math.PI, true);
                    ctx.stroke();
                }

                // 주변 진공 수축 아우라선 효과
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.15)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([8, 12]);
                ctx.beginPath();
                ctx.arc(0, 0, this.r * pulse + 15 + Math.sin(Date.now() * 0.01) * 6, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- 8. 보조 이펙트 파티클 및 바람선 ---
        class FlatParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 4 + 2.5;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1.2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.life -= this.decay;
            }
            draw() {
                let sx = this.x - camera.x + canvas.width / 2;
                let sy = this.y - camera.y + canvas.height / 2;
                if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) return;

                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(sx, sy, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class DnaDot {
            constructor(x, y, color) {
                this.x = x + (Math.random() - 0.5) * 8;
                this.y = y + (Math.random() - 0.5) * 8;
                this.color = color;
                this.size = 2.0;
                this.life = 1.0;
                this.decay = 0.06;
            }
            update() {
                this.y -= 0.25;
                this.life -= this.decay;
            }
            draw() {
                let sx = this.x - camera.x + canvas.width / 2;
                let sy = this.y - camera.y + canvas.height / 2;
                if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) return;

                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#4ade80';
                ctx.beginPath();
                ctx.arc(sx, sy, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class WindVisualLine {
            constructor() {
                this.x = Math.random() * WORLD_SIZE;
                this.y = Math.random() * WORLD_SIZE;
                this.length = Math.random() * 80 + 40;
                this.speed = Math.random() * 2 + 2;
                this.opacity = Math.random() * 0.15 + 0.05;
            }
            update() {
                this.x += Math.cos(windAngle) * this.speed * windPower;
                this.y += Math.sin(windAngle) * this.speed * windPower;

                if (this.x < 0) this.x = WORLD_SIZE;
                if (this.x > WORLD_SIZE) this.x = 0;
                if (this.y < 0) this.y = WORLD_SIZE;
                if (this.y > WORLD_SIZE) this.y = 0;
            }
            draw() {
                let sx = this.x - camera.x + canvas.width / 2;
                let sy = this.y - camera.y + canvas.height / 2;

                if (sx < -100 || sx > canvas.width + 100 || sy < -100 || sy > canvas.height + 100) return;

                ctx.save();
                ctx.strokeStyle = themeMode === 'dark' ? '#4ade80' : '#22c55e';
                ctx.globalAlpha = this.opacity;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([15, 12]);
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx - Math.cos(windAngle) * this.length, sy - Math.sin(windAngle) * this.length);
                ctx.stroke();
                ctx.restore();
            }
        }

        // --- 9. 카메라 추적 시스템 및 HUD 통합 ---
        function updateCamera() {
            if (phageSwarm.length > 0) {
                // 모든 활성 파지들의 평균 중심(Centroid) 위치 계산
                let avgX = 0;
                let avgY = 0;
                phageSwarm.forEach(p => {
                    avgX += p.x;
                    avgY += p.y;
                });
                avgX /= phageSwarm.length;
                avgY /= phageSwarm.length;

                // 카메라 대상 좌표 보간 스무딩
                camera.targetX = avgX;
                camera.targetY = avgY;
            }

            // 카메라 선형 보간 이동
            camera.x += (camera.targetX - camera.x) * 0.08;
            camera.y += (camera.targetY - camera.y) * 0.08;

            // 카메라가 가상 월드 바깥으로 빠져나가지 못하게 조율
            const halfW = canvas.width / 2;
            const halfH = canvas.height / 2;
            camera.x = Math.max(halfW, Math.min(WORLD_SIZE - halfW, camera.x));
            camera.y = Math.max(halfH, Math.min(WORLD_SIZE - halfH, camera.y));
        }

        // --- 10. 시뮬레이터 라이프사이클 엔진 ---
        function initChamber() {
            phageSwarm = [];
            bacteriaList = [];
            enemies = [];
            particles = [];
            windVisualLines = [];

            // 1. 바람 유성선 투하
            for (let i = 0; i < 45; i++) {
                windVisualLines.push(new WindVisualLine());
            }

            // 2. 월드 맵에 박테리아 40마리 균등 전파 분산 스폰
            for (let i = 0; i < 40; i++) {
                bacteriaList.push(new CuteBacteria(i < 8)); // 8마리는 로딩 시 유저 화면 근처에 스폰
            }

            // 3. 천적 백혈구 4마리 스폰
            for (let i = 0; i < 4; i++) {
                enemies.push(new Macrophage());
            }

            // 4. 최초 1마리의 박테리오파지로 기품있게 개시! (마켓오브라우니님의 요구 구현)
            phageSwarm.push(new MiniaturePhage(WORLD_SIZE / 2, WORLD_SIZE / 2));

            // 카메라를 초기 위치로 스냅
            camera.x = WORLD_SIZE / 2;
            camera.y = WORLD_SIZE / 2;

            updateDashboardUI();
        }

        function spawnBacterium() {
            if (bacteriaList.length >= 80) return;
            bacteriaList.push(new CuteBacteria());
            updateDashboardUI();
        }

        function addDnaPoints(amt) {
            dnaPoints += amt;
            updateUpgradeCardsUI();
            updateDashboardUI();
        }

        function updateDashboardUI() {
            const dnaDisplay = document.getElementById('dna-score-display');
            if (dnaDisplay) dnaDisplay.innerText = dnaPoints;

            const countDisplay = document.getElementById('phage-count-display');
            if (countDisplay) countDisplay.innerText = phageSwarm.length;

            const infectedDisplay = document.getElementById('infected-count-display');
            if (infectedDisplay) {
                const infected = bacteriaList.filter(b => b.isInfected).length;
                infectedDisplay.innerText = `${infected} / ${bacteriaList.length}`;
            }
        }

        // --- 11. 유전자 업그레이드 전사 엔진 ---
        function getUpgradeCost(key) {
            const upg = upgrades[key];
            return Math.floor(upg.baseCost * Math.pow(upg.costMultiplier, upg.level - 1));
        }

        function purchaseUpgrade(key) {
            const upg = upgrades[key];
            const cost = getUpgradeCost(key);

            if (dnaPoints >= cost) {
                dnaPoints -= cost;
                upg.level += 1;

                if (key === 'injection') {
                    upg.value += 0.01; 
                } else if (key === 'burst') {
                    upg.value += 3;     
                } else if (key === 'magnetic') {
                    upg.value += 18;    
                }

                updateUpgradeCardsUI();
                updateDashboardUI();
                triggerModal("유전자 강화 발현!", "박테리오파지의 신체 구조 설계가 새롭게 각인되었습니다.", "success");
            } else {
                triggerModal("DNA Mutagen 부족", "강화 형질을 유전체에 탑재하기에 DNA 에너지가 모자랍니다.", "error");
            }
        }

        function updateUpgradeCardsUI() {
            const keys = ['injection', 'burst', 'magnetic'];
            keys.forEach(key => {
                const upg = upgrades[key];
                const cost = getUpgradeCost(key);

                const lvEl = document.getElementById(`upg-${key}-level`);
                const costEl = document.getElementById(`upg-${key}-cost`);
                if (lvEl) lvEl.innerText = `Lv.${upg.level}`;
                if (costEl) costEl.innerText = cost;

                const card = document.getElementById(`upg-${key}`);
                if (card) {
                    if (dnaPoints < cost) {
                        card.style.opacity = '0.55';
                    } else {
                        card.style.opacity = '1.0';
                    }
                }
            });
        }

        // --- 12. 전체 화면 캔버스 렌더링 최적화 루프 ---
        function setupCanvasSize() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initPetriNetwork();
        }

        function initPetriNetwork() {
            // 무한 모드에서는 3000px 월드 배양접시로 설정하므로, 화면 가시 챔버용 기하학적 요소 초기화 생략
        }

        window.addEventListener('resize', () => {
            setupCanvasSize();
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 카메라 추적 연산
            updateCamera();

            // 2. 실시간 조작 기반 바람 보간
            calculateRealTimeWind();

            // 3. 월드 격자 그리드 및 경계 배경선 그리기
            drawWorldScrollingGrid();

            // 4. 바람 흐름 안내선 연산 및 드로잉
            windVisualLines.forEach(wl => {
                wl.update();
                wl.draw();
            });

            // 5. 세균 업데이트 및 컬링 렌더링
            bacteriaList = bacteriaList.filter(b => !b.isDead);
            bacteriaList.forEach(bac => {
                bac.update();
                bac.draw();
            });

            // 최소 세균 밀도 유지
            if (bacteriaList.length < 25) {
                bacteriaList.push(new CuteBacteria());
            }

            // 6. 파지 군단 업데이트 및 렌더링
            phageSwarm.forEach(ph => {
                ph.update();
                ph.draw();
            });

            // 7. 천적 백혈구 정밀 추격 업데이트 및 렌더링
            enemies.forEach(en => {
                en.update();
                en.draw();
            });

            // 8. 파열 및 타격 스파크 이펙트 렌더링
            particles = particles.filter(pt => pt.life > 0);
            particles.forEach(pt => {
                pt.update();
                pt.draw();
            });

            updateDashboardUI();
            requestAnimationFrame(animate);
        }

        // 무한 공간 연출을 위한 뷰포트 상대 그리드 드로잉 기법
        function drawWorldScrollingGrid() {
            ctx.save();
            
            // 격자 테두리선
            ctx.strokeStyle = themeMode === 'dark' ? '#1f2937' : '#e2e8f0';
            ctx.lineWidth = 1.5;

            const gridSpacing = 120; // 120px 단위로 눈금 배치
            
            // 현재 화면 좌측상단의 월드 좌표 연산
            const startX = Math.floor((camera.x - canvas.width / 2) / gridSpacing) * gridSpacing;
            const endX = startX + canvas.width + gridSpacing * 2;

            const startY = Math.floor((camera.y - canvas.height / 2) / gridSpacing) * gridSpacing;
            const endY = startY + canvas.height + gridSpacing * 2;

            // 세로선 그리기
            for (let x = startX; x <= endX; x += gridSpacing) {
                if (x < 0 || x > WORLD_SIZE) continue;
                let sx = x - camera.x + canvas.width / 2;
                ctx.beginPath();
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, canvas.height);
                ctx.stroke();
            }

            // 가로선 그리기
            for (let y = startY; y <= endY; y += gridSpacing) {
                if (y < 0 || y > WORLD_SIZE) continue;
                let sy = y - camera.y + canvas.height / 2;
                ctx.beginPath();
                ctx.moveTo(0, sy);
                ctx.lineTo(canvas.width, sy);
                ctx.stroke();
            }

            // 거대한 월드 경계 한계선 드로잉 (외벽 탈출 경고선)
            ctx.strokeStyle = themeMode === 'dark' ? '#ef4444' : '#dc2626';
            ctx.lineWidth = 6;
            ctx.setLineDash([10, 10]);

            const borderL = 0 - camera.x + canvas.width / 2;
            const borderR = WORLD_SIZE - camera.x + canvas.width / 2;
            const borderT = 0 - camera.y + canvas.height / 2;
            const borderB = WORLD_SIZE - camera.y + canvas.height / 2;

            ctx.beginPath();
            ctx.rect(borderL, borderT, borderR - borderL, borderB - borderT);
            ctx.stroke();

            ctx.restore();
        }

        // --- 13. 부트 시작 시점 및 이벤트 바인딩 안정성 확보 ---
        window.onload = function() {
            setupCanvasSize();
            initChamber();
            updateUpgradeCardsUI();

            // 안전한 Null-Safe 요소 바인딩
            const btnSpawn = document.getElementById('btn-spawn-bacteria');
            if (btnSpawn) {
                btnSpawn.addEventListener('click', () => {
                    spawnBacterium();
                    spawnBacterium();
                });
            }

            const btnReset = document.getElementById('btn-reset');
            if (btnReset) {
                btnReset.addEventListener('click', () => {
                    dnaPoints = 0;
                    initChamber();
                    updateUpgradeCardsUI();
                    triggerModal("무한 배양접시 리셋 완료", "DNA 점수와 모든 유기체 배치가 최초 1마리 사냥 상태로 리빌딩되었습니다.", "info");
                });
            }

            const btnEmergency = document.getElementById('btn-emergency-spawn');
            if (btnEmergency) {
                btnEmergency.addEventListener('click', () => {
                    const rx = camera.x + (Math.random() - 0.5) * 150;
                    const ry = camera.y + (Math.random() - 0.5) * 150;
                    phageSwarm.push(new MiniaturePhage(rx, ry));
                    updateDashboardUI();
                });
            }

            animate();
        };
    </script>
</body>
</html>
